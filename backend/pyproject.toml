[project]
name = "treeminddb-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "numpy>=2.0", "python-multipart>=0.0.9", "httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0", "torch>=2.3", "laya>=0.1"]
pdf = ["pypdf>=5.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
